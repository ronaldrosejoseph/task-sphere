# Supabase CLI configuration.
#
# CI does not need a project ref: .github/workflows/production.yml runs
# `supabase db push --db-url "$SUPABASE_DB_URL"` with the project-scoped
# connection string from the SUPABASE_DB_URL secret, so no account-level
# token and no committed ref are required — the repo stays safe to make
# public.
#
# For local CLI work (e.g. `supabase migration up` against the local
# stack), run once on your machine:
#   supabase link --project-ref <your-project-ref>
