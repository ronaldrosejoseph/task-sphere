# Supabase CLI configuration.
#
# The project ref is intentionally NOT stored here: it is injected at
# deploy time from the SUPABASE_PROJECT_ID secret
# (.github/workflows/production.yml runs `supabase link --project-ref
# $SUPABASE_PROJECT_ID`, which writes it into this file on the CI runner
# only), so it never appears in this repo — keeping the repo safe to make
# public.
#
# To work with the CLI locally, run once on your machine:
#   supabase link --project-ref <your-project-ref>
