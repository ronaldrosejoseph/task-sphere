name: Deploy Migrations to Production

# Applies pending supabase/migrations/*.sql files to the production
# database on every merge to main, using the official Supabase CLI:
# link the project with the access token, then `supabase db push` with
# the database password. The project ref is derived from the SUPABASE_URL
# secret so it is never committed to the repo.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive the project ref from SUPABASE_URL
        id: ref
        run: echo "ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')" >> "$GITHUB_OUTPUT"

      - name: Link the production project
        run: supabase link --project-ref ${{ steps.ref.outputs.ref }}

      - name: Apply pending migrations
        run: supabase db push
