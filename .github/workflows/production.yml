name: Deploy Migrations to Production

# Applies pending supabase/migrations/*.sql files to the production
# database on every merge to main. The project's network restriction stays
# ON: this job temporarily authorizes the runner's own public IP via the
# Supabase Management API, applies migrations over the direct connection
# string, and removes the IP again in a cleanup step that always runs
# (even when migrations fail).
#
# NOTE: the Management API calls use curl, not Python urllib — Cloudflare
# blocks urllib's User-Agent at the edge with error 1010. The apply body
# uses camelCase dbAllowedCidrs (the spec'd schema); the snake_case docs
# variant is silently ignored.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Get the runner's public IP
        id: ip
        run: echo "ip=$(curl -4 -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Temporarily authorize the runner's IP
        env:
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          set -euo pipefail
          REF="$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
          IP_32="$RUNNER_IP/32"
          BASE="https://api.supabase.com/v1/projects/$REF"

          apply_restrictions() {
            local body="$1"
            curl --fail-with-body -sS -A "task-sphere-ci" -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body" "$BASE/network-restrictions" \
              || curl --fail-with-body -sS -A "task-sphere-ci" -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body" "$BASE/network-restrictions/apply"
          }

          CURRENT="$(curl --fail-with-body -sS -A "task-sphere-ci" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$BASE/network-restrictions")"
          if echo "$CURRENT" | jq -e --arg ip "$IP_32" \
            '(.config.dbAllowedCidrs // []) | index($ip)' >/dev/null; then
            echo "$IP_32 already allowed"
            exit 0
          fi

          NEW="$(echo "$CURRENT" | jq -c --arg ip "$IP_32" \
            '(.config.dbAllowedCidrs // []) + [$ip]')"
          APPLIED="$(apply_restrictions "{\"dbAllowedCidrs\": $NEW}")"
          if echo "$APPLIED" | jq -e --arg ip "$IP_32" \
            '(.config.dbAllowedCidrs // []) | index($ip)' >/dev/null; then
            echo "Authorized $IP_32"
          else
            echo "ERROR: $IP_32 was not applied; response: $APPLIED"
            exit 1
          fi

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Remove the runner's IP access
        if: always()
        env:
          RUNNER_IP: ${{ steps.ip.outputs.ip }}
        run: |
          set -euo pipefail
          REF="$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')"
          IP_32="$RUNNER_IP/32"
          BASE="https://api.supabase.com/v1/projects/$REF"

          apply_restrictions() {
            local body="$1"
            curl --fail-with-body -sS -A "task-sphere-ci" -X POST \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body" "$BASE/network-restrictions" \
              || curl --fail-with-body -sS -A "task-sphere-ci" -X POST \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body" "$BASE/network-restrictions/apply"
          }

          CURRENT="$(curl --fail-with-body -sS -A "task-sphere-ci" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "$BASE/network-restrictions")"
          REMAINING="$(echo "$CURRENT" | jq -c --arg ip "$IP_32" \
            '[.config.dbAllowedCidrs[] | select(. != $ip)]')"
          APPLIED="$(apply_restrictions "{\"dbAllowedCidrs\": $REMAINING}")"
          if echo "$APPLIED" | jq -e --arg ip "$IP_32" \
            '(.config.dbAllowedCidrs // []) | index($ip)' >/dev/null; then
            echo "WARNING: $IP_32 still allowed; remove it manually under Network Restrictions."
            exit 1
          fi
          echo "Removed $IP_32; $(echo "$APPLIED" | jq -c '.config.dbAllowedCidrs | length') entries remain"
