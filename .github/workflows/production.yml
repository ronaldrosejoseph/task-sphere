name: Deploy Migrations to Production

# Applies pending supabase/migrations/*.sql files to the production
# database on every merge to main. Connects directly with the project's
# database connection string (SUPABASE_DB_URL secret) — project-scoped, no
# account-level access token needed.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
